    <style>
      /* Splash de arranque: visible antes de que el bundle cargue (cold start + PWA). */
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffffff; color: #111827; font-family: system-ui, sans-serif; }

      #boot-splash .boot-bar { width: 160px; height: 3px; border-radius: 99px; background: #dcfce7; overflow: hidden; }
      #boot-splash .boot-bar > div { height: 100%; width: 40%; border-radius: 99px; background: #16a34a; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
